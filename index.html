<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Iam Sorry Sayang</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 320px;
            position: relative;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            font-size: 15px;
            margin-bottom: 40px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            position: absolute;
        }

        #yes {
            background-color: #ff4d6d;
            color: white;
            left: 60px;
            bottom: 20px;
        }

        #no {
            background-color: #ccc;
            color: black;
            right: 60px;
            bottom: 20px;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Hai Bubub</h1>
    <p>
        Aku kemarin minta maaf karena yaahhps kurang romance kata bubub wlek,  
        aku buat ini karena inilah yang terbaik menurutku sayang dan hope we can back together once more  
        aku ingin kita balikan lagi sayang nggak mau jadi teman cjja yayayayaya?
        <br><br>
        Bubub mw nggak jadi pacarku?
    </p>

    <button id="yes" onclick="goYes()">Mw</button>
    <button id="no">Nggak Mw</button>
</div>

<script>
    const noBtn = document.getElementById("no");

    noBtn.addEventListener("mouseover", () => {
        const x = Math.random() * 200 - 100;
        const y = Math.random() * 200 - 100;
        noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    function goYes() {
        window.location.href = "mau.html";
    }
</script>

</body>
</html>
